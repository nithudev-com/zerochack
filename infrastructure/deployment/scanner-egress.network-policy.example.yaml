# Template only: adapt namespace and data-service selectors to the production cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zerochack-scanner-controlled-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zerochack-worker
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              zerochack.io/data-service: "true"
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4]
        - ipBlock:
            cidr: ::/0
            except: [::/128, ::1/128, fc00::/7, fe80::/10, ff00::/8, 2001:db8::/32]
      ports:
        - { protocol: TCP, port: 80 }
        - { protocol: TCP, port: 443 }
