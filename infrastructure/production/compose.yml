name: codebandage

x-runtime: &runtime
  init: true
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  pids_limit: 256
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
  stop_grace_period: 90s

x-client: &client
  <<: *runtime
  env_file:
    - path: ${STATE_DIR:?Set protected state directory}/app.env
      format: raw
    - path: ${STATE_DIR}/smtp.env
      format: raw
  environment:
    NODE_EXTRA_CA_CERTS: /run/trust/ca.crt
  volumes:
    - ${STATE_DIR}/trust:/run/trust:ro
  networks: [data, outbound]
  mem_limit: 2g
  cpus: 1.5

services:
  postgres:
    <<: *runtime
    image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    user: '70:70'
    env_file: ${STATE_DIR}/postgres.env
    environment:
      POSTGRES_USER: zerochack
      POSTGRES_DB: zerochack
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/run/tls/server.crt, -c, ssl_key_file=/run/tls/server.key, -c, hba_file=/etc/postgresql/pg_hba.conf, -c, max_connections=100, -c, shared_buffers=256MB]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${STATE_DIR}/postgres-tls:/run/tls:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ${STATE_DIR}/trust:/run/trust:ro
    networks: [data]
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U zerochack -d zerochack']
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    <<: *runtime
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    user: '999:1000'
    command: [redis-server, /run/redis/redis.conf]
    volumes:
      - redis_data:/data
      - ${STATE_DIR}/redis-tls:/run/tls:ro
      - ${STATE_DIR}/redis-config:/run/redis:ro
      - ${STATE_DIR}/trust:/run/trust:ro
    networks: [data]
    mem_limit: 768m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$(cat /run/redis/password) redis-cli --tls --cacert /run/trust/ca.crt -h redis ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 12
  api:
    <<: *client
    image: ${API_IMAGE:?Use tested immutable image identity}
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:4000/v1/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 8s
      retries: 12
  worker:
    <<: *client
    image: ${WORKER_IMAGE:?Use tested immutable image identity}
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, 'const R=require("ioredis");const r=new R(process.env.REDIS_URL,{maxRetriesPerRequest:1});r.get("zerochack:worker:heartbeat").then(v=>{r.disconnect();process.exit(v&&Date.now()-Date.parse(v)<90000?0:1)}).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 8s
      retries: 3
  web:
    <<: *runtime
    image: ${WEB_IMAGE:?Use tested immutable image identity}
    environment:
      APP_URL: https://codebandage.com
      NEXT_PUBLIC_API_URL: https://codebandage.com/v1
    ports: ['127.0.0.1:3000:3000']
    networks: [outbound]
    mem_limit: 1536m
    cpus: 1.5
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/sign-in").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 8s
      retries: 12
  tools:
    <<: *client
    image: ${TOOLS_IMAGE:?Use tested immutable image identity}
    restart: 'no'
    profiles: [tools]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

networks:
  data: {internal: true}
  outbound: {}
volumes:
  postgres_data:
    name: codebandage_postgres_data
  redis_data:
    name: codebandage_redis_data
