name: zerochack

x-app-environment: &app-environment
  NODE_ENV: development
  CARE_ENABLED: ${CARE_ENABLED:-false}
  CARE_REPAIR_ENABLED: ${CARE_REPAIR_ENABLED:-false}
  CARE_RELEASE_ENABLED: ${CARE_RELEASE_ENABLED:-false}
  CARE_VAULT_KEY: ${CARE_VAULT_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  CARE_ARTIFACT_KEY: ${CARE_ARTIFACT_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  CARE_JOB_BUDGET_MICROS: ${CARE_JOB_BUDGET_MICROS:-500000}
  DATABASE_URL: postgresql://zerochack:zerochack_local@postgres:5432/zerochack?schema=public
  REDIS_URL: redis://redis:6379
  SESSION_SECRET: local-compose-secret-change-before-production
  CORS_ORIGINS: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:4000/v1
  APP_URL: http://localhost:3000
  MFA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  AI_CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  PAYMENT_CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  INTEGRATION_CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  REPORT_SIGNING_KEY: local-report-signing-key-change-me
  METRICS_TOKEN: local-metrics-token-change-before-prod
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  SMTP_SECURE: "false"
  SMTP_FROM: security@zerochack.local
  LOG_LEVEL: info
  TRUST_PROXY: "false"
  SCANNER_TIMEOUT_MS: 10000
  SCANNER_MAX_REDIRECTS: 5
  SCANNER_MAX_RESPONSE_BYTES: 1048576

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zerochack
      POSTGRES_PASSWORD: zerochack_local
      POSTGRES_DB: zerochack
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerochack -d zerochack"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025", "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"]
  migrate:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.migrate
    environment: *app-environment
    command: ["npm", "run", "db:migrate:deploy"]
    depends_on:
      postgres: { condition: service_healthy }
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    environment: *app-environment
    ports: ["127.0.0.1:${API_HOST_PORT:-4000}:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/v1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.worker
    environment: *app-environment
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/v1
    environment: *app-environment
    ports: ["127.0.0.1:${WEB_HOST_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

volumes:
  postgres_data:
  redis_data:
