name: Care validation bundle
on:
  push:
    branches: ['codex/zeroroot-chat-care-upgrade']
    paths: ['.github/workflows/care-validation-bundle.yml']
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package tracked source and installed public dependencies only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-bundle
          git archive --format=tar HEAD > validation-bundle/source.tar
          tar --exclude='node_modules/.cache' -czf validation-bundle/dependencies.tar.gz node_modules
          git rev-parse HEAD > validation-bundle/COMMIT.txt
          node --version > validation-bundle/NODE_VERSION.txt
          sha256sum validation-bundle/*.tar* > validation-bundle/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: care-validation-${{ github.sha }}
          path: validation-bundle/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
