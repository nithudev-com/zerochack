name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zerochack
          POSTGRES_PASSWORD: zerochack_test
          POSTGRES_DB: zerochack_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zerochack -d zerochack_test" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      API_HOST: 127.0.0.1
      API_PORT: 4000
      WEB_PORT: 3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/v1
      DATABASE_URL: postgresql://zerochack:zerochack_test@127.0.0.1:5432/zerochack_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_SECRET: ci-only-secret-that-is-at-least-32-characters
      CORS_ORIGINS: http://127.0.0.1:3000
      LOG_LEVEL: silent
      TRUST_PROXY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run db:migrate:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run openapi:generate
      - run: git diff --exit-code -- docs/openapi.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:care
