name: Care observation validation
on:
  push:
    branches: ['codex/care-observation-validation']
    paths: ['.github/workflows/care-observation-validation.yml', '.github/apply-care-increment.py', 'apps/web/components/care-observations.tsx']
permissions:
  contents: write
concurrency:
  group: care-observation-validation
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'nithudev-com/zerochack'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zerochack
          POSTGRES_PASSWORD: zerochack_test
          POSTGRES_DB: zerochack_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zerochack -d zerochack_test" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      API_HOST: 127.0.0.1
      API_PORT: 4000
      WEB_PORT: 3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/v1
      DATABASE_URL: postgresql://zerochack:zerochack_test@127.0.0.1:5432/zerochack_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_SECRET: ci-only-secret-that-is-at-least-32-characters
      CORS_ORIGINS: http://127.0.0.1:3000
      LOG_LEVEL: silent
      TRUST_PROXY: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact-baseline integration edits
        run: python .github/apply-care-increment.py
      - name: Install and validate application with disposable services
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/care-validation"
          check() { name="$1"; shift; "$@" 2>&1 | tee "$RUNNER_TEMP/care-validation/$name.log"; }
          check install npm ci
          check audit npm audit --audit-level=moderate
          check migrations npm run db:migrate:deploy
          check lint npm run lint
          check types npm run typecheck
          check unit npm test
          check integration npm run test:integration
          check build npm run build
          check openapi npm run openapi:generate
          git diff --check
          cp docs/openapi.json "$RUNNER_TEMP/care-validation/openapi.json"
      - run: npx playwright install --with-deps chromium
      - name: Portal and Care browser verification
        shell: bash
        run: |
          set -euo pipefail
          npm run test:e2e 2>&1 | tee "$RUNNER_TEMP/care-validation/portal-browser.log"
          npm run test:e2e:care 2>&1 | tee "$RUNNER_TEMP/care-validation/care-development.log"
          CARE_WEB_PRODUCTION=true npm run test:e2e:care 2>&1 | tee "$RUNNER_TEMP/care-validation/care-production.log"
      - name: Commit validated source on preparation branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/care-observation-validation
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git diff f47b31b7e17b3c75d4a8cc8b5a1570e13db2e326 -- .env.example apps packages docs > "$RUNNER_TEMP/care-validation/validated-changes.patch"
          git rm .github/apply-care-increment.py
          git add .env.example apps packages docs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(care): integrate consented observations with verified scope and retained evidence'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD | tee "$RUNNER_TEMP/care-validation/COMMIT.txt"
          git rev-parse 'HEAD^{tree}' | tee "$RUNNER_TEMP/care-validation/TREE.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: care-observation-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/care-validation/
            test-results/
          retention-days: 3
          if-no-files-found: warn
