name: CodeBandage source inventory
on:
  push:
    branches: ['codex/zeroroot-chat-care-upgrade']
    paths: ['.github/workflows/codebandage-prepare.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inventory source and installed public dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/codebandage-source
          git archive --format=tar.gz HEAD > /tmp/codebandage-source/source.tar.gz
          git rev-parse HEAD > /tmp/codebandage-source/COMMIT.txt
          git grep -n -i -E 'zeroroot|zero root|zero-root|zerochack' -- apps packages docs README.md .env.example > /tmp/codebandage-source/brand-inventory.txt || test "$?" = 1
          tar --exclude='node_modules/.cache' -czf /tmp/codebandage-source/dependencies.tar.gz node_modules
          npm audit --json > /tmp/codebandage-source/dependency-audit.json || true
          sha256sum /tmp/codebandage-source/*.tar.gz
          echo 'Tracked source and public lockfile dependencies only; no git credentials or environment files added.'
      - uses: actions/upload-artifact@v4
        with:
          name: codebandage-source
          path: /tmp/codebandage-source/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
