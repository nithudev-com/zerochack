name: CodeBandage source inventory
on:
  push:
    branches: ['codex/zeroroot-chat-care-upgrade']
    paths: ['.github/workflows/codebandage-prepare.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect uploaded artwork blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/codebandage-source
          gh api repos/nithudev-com/zerochack/git/blobs/e0c1fc0facc5740f8d5235af0543311a5b753acb --jq .content | base64 --decode > /tmp/codebandage-source/transferred-logo.webp
          sha256sum /tmp/codebandage-source/transferred-logo.webp
      - uses: actions/upload-artifact@v4
        with:
          name: codebandage-logo-integrity
          path: /tmp/codebandage-source/
          retention-days: 1
          if-no-files-found: error
